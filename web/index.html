<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Expense Tracker</title>
  <meta name="description" content="Track daily spending, manage budgets by category, set recurring expenses, and back up to Google Drive.">
  <meta name="theme-color" content="#F5FBF8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Expenses">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="css/aurora.css">
  <script src="config.js"></script>
</head>
<body>
  <div id="app">
    <main id="screen"></main>
    <nav id="nav" class="nav-bar" aria-label="Main navigation"></nav>
  </div>

  <noscript>
    <p style="padding:24px;text-align:center">Expense Tracker needs JavaScript enabled.</p>
  </noscript>

  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => { /* offline support is optional */ });
      });
    }
  </script>
</body>
</html>
