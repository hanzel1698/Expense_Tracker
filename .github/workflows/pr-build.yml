name: PR Build (Debug APK)

# Lightweight CI build that validates a branch/PR compiles and produces an
# installable debug APK. Unlike the release workflows, this needs no signing
# secrets — the debug build is signed with the checked-in debug keystore.
# Manual-only: trigger from the Actions tab (workflow_dispatch).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compile (Kotlin, debug)
        run: ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Find APK
        id: apk
        run: |
          APK=$(find . -path "*/build/outputs/apk/debug/*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "Error: debug APK not found"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14

      - name: Build release APK
        # No Play secrets on CI, so the release build falls back to debug-key
        # signing (see app/build.gradle.kts) — an installable release-variant
        # APK for testing, not for Play upload.
        run: ./gradlew assembleRelease --stacktrace

      - name: Find release APK
        id: release_apk
        run: |
          APK=$(find . -path "*/build/outputs/apk/release/*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "Error: release APK not found"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.run_number }}
          path: ${{ steps.release_apk.outputs.path }}
          retention-days: 14
