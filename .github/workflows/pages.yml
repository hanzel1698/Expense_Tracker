name: Deploy web app (GitHub Pages)

# Publishes the static web app in `web/` to GitHub Pages on every push to
# master. There is no build step — the app is plain ES modules and CSS — so
# this just uploads the directory as-is, the same thing `netlify.toml`'s
# `publish = "web"` does.
#
# No setup needed: configure-pages runs with `enablement: true`, so the first
# run turns Pages on itself. The site is served at
# https://<owner>.github.io/<repo>/ — a subpath, which the app handles because
# every asset path, the manifest's start_url/scope and the service-worker
# registration are all relative.

on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway: one in-progress run finishes before the next
# starts, so the live site is always a complete upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # `enablement: true` turns Pages on via the API if it isn't already, so
      # the repo needs no manual Settings → Pages step before the first deploy.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload web/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
