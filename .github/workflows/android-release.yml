name: Android Release Build

# Build a release APK, hand it to Firebase App Distribution (installs on the
# tester's device), and publish it as a GitHub Release. Manual-only: trigger
# from the Actions tab (workflow_dispatch).

on:
  workflow_dispatch:
    inputs:
      run_name:
        description: Custom name for this run (optional)
        required: false
        type: string

run-name: "${{ inputs.run_name || format('Android Release Build #{0}', github.run_number) }}"

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    # Give every CI build its own version code so App Distribution releases are
    # distinguishable and each one re-triggers the in-app What's New screen.
    env:
      CI_VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history so the release-notes script can diff against the last tag.
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate release notes for APK
        run: python3 scripts/generate-android-release-notes.py .

      - name: Build release APK
        # No Play upload keystore is configured, so the release build is signed
        # with the debug keystore checked into the repo root (see
        # app/build.gradle.kts). That key is stable across every build, so each
        # distributed APK installs cleanly over the previous one.
        run: ./gradlew assembleRelease --stacktrace

      - name: Find APK
        id: apk
        run: |
          APK=$(find . -path "*/build/outputs/apk/release/*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "Error: release APK not found"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"

      - name: Extract app version
        id: version
        run: |
          set -euo pipefail
          BASE_NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          # Mirror app/build.gradle.kts: CI builds are <major>.<run number>.
          VERSION_NAME="${BASE_NAME%%.*}.$CI_VERSION_CODE"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CI_VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.version.outputs.tag }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Check Firebase App Distribution config
        id: firebase_config
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          # The Firebase App ID is not a secret (it ships inside
          # google-services.json), so a repository variable is enough.
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID || secrets.FIREBASE_APP_ID }}
        run: |
          set -euo pipefail
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ] && [ -n "$FIREBASE_APP_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "app_id=$FIREBASE_APP_ID" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Firebase App Distribution skipped::Set the FIREBASE_SERVICE_ACCOUNT_JSON repository secret and the FIREBASE_APP_ID repository variable to enable APK distribution."
          fi

      - name: Compose Firebase release notes
        if: steps.firebase_config.outputs.configured == 'true'
        run: |
          set -uo pipefail
          NOTES_FILE="firebase-release-notes.txt"
          {
            echo "Version ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }}) - build ${{ github.run_number }}"
            echo "Commit ${GITHUB_SHA:0:7} on ${GITHUB_REF_NAME}"
            echo
            # Reuse the feature list already generated for the in-app "What's New"
            # screen. Never fail the build over release notes - fall back to the
            # commit subject.
            jq -r '.features[] | "- " + .' app/src/main/assets/release_notes.json 2>/dev/null \
              || git log -1 --pretty='- %s'
          } > "$NOTES_FILE"
          cat "$NOTES_FILE"

      - name: Distribute release APK to Firebase App Distribution
        if: steps.firebase_config.outputs.configured == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1.7.1
        with:
          appId: ${{ steps.firebase_config.outputs.app_id }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          file: ${{ steps.apk.outputs.path }}
          testers: ${{ vars.FIREBASE_TESTERS || 'hanzel.h.fernandez@gmail.com' }}
          releaseNotesFile: firebase-release-notes.txt

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: ${{ steps.apk.outputs.path }}
          tag: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.name }} (build ${{ github.run_number }})
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
          makeLatest: true
          body: |
            **Version:** ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
            **Commit:** ${{ github.sha }}

            Download the APK to sideload on a device, or install it from the
            Firebase App Tester app if you are on the tester list.
