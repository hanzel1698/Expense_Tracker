name: Android Release Build

# Build a signed release APK and hand it to Firebase App Distribution for
# solo internal testing. Manual-only: trigger from the Actions tab
# (workflow_dispatch). No Play Store, no AAB, no release notes.

on:
  workflow_dispatch:
    inputs:
      run_name:
        description: Custom name for this run (optional)
        required: false
        type: string

run-name: "${{ inputs.run_name || format('Android Release Build #{0}', github.run_number) }}"

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # n starts at 0 on the first run and increases by 1 every run, so
      # versionName goes 1.0, 1.1, ... 1.99, 2.0, 2.1, ... — minor rolls
      # 0-99 and bumps major on rollover. versionCode is just the run
      # number: a plain, always-increasing integer as Android requires.
      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          n=$(( ${{ github.run_number }} - 1 ))
          major=$(( 1 + n / 100 ))
          minor=$(( n % 100 ))
          echo "name=${major}.${minor}" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # Ephemeral, uncommitted edit scoped to this run only — nothing is
      # pushed back to the repo.
      - name: Apply computed version to app/build.gradle.kts
        run: |
          set -euo pipefail
          sed -i "s/versionCode = 1\$/versionCode = ${{ steps.version.outputs.code }}/" app/build.gradle.kts
          sed -i "s/versionName = \"1.0\"/versionName = \"${{ steps.version.outputs.name }}\"/" app/build.gradle.kts
          grep -n "versionCode = ${{ steps.version.outputs.code }}\|versionName = \"${{ steps.version.outputs.name }}\"" app/build.gradle.kts

      - name: Install release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${KEYSTORE_BASE64:-}" ] && missing+=("KEYSTORE_BASE64")
          [ -z "${KEYSTORE_PASSWORD:-}" ] && missing+=("KEYSTORE_PASSWORD")
          [ -z "${KEY_ALIAS:-}" ] && missing+=("KEY_ALIAS")
          [ -z "${KEY_PASSWORD:-}" ] && missing+=("KEY_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing or empty release signing secret(s): ${missing[*]}. Add them under Settings -> Secrets and variables -> Actions before running this workflow."
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Decoded keystore is empty - check the KEYSTORE_BASE64 secret."
            exit 1
          fi
          {
            echo "KEYSTORE_FILE=$KEYSTORE_PATH"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Find APK
        id: apk
        run: |
          set -euo pipefail
          APK=$(find . -path "*/build/outputs/apk/release/*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "Error: release APK not found"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.version.outputs.name }}-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Check Firebase App Distribution config
        id: firebase_config
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning title=Firebase App Distribution skipped::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set. Add it under Settings -> Secrets and variables -> Actions to enable distribution."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$FIREBASE_APP_ID" ]; then
            echo "::warning title=Firebase App Distribution skipped::FIREBASE_APP_ID repository variable is not set. Add it under Settings -> Secrets and variables -> Actions -> Variables to enable distribution."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Distribute release APK to Firebase App Distribution
        if: steps.firebase_config.outputs.configured == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1.7.1
        with:
          appId: ${{ vars.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          file: ${{ steps.apk.outputs.path }}
          testers: hanzel.h.fernandez@gmail.com
